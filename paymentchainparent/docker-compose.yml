# Networks
networks:
  microservices-network:
    driver: bridge
  keycloak-network:
    driver: bridge
    
# Volumes
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  keycloak_db_data:
    driver: local
  keycloak_data:
    driver: local
    
# Services
services:
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    networks:
      - microservices-network
    environment:
      POSTGRES_DB: microservices_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_MULTIPLE_DATABASES: customers_db,products_db,transactions_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d microservices_db"]
      interval: 30s
      timeout: 10s
      retries: 3
      
  pgadmin4:
    image: dpage/pgadmin4:latest
    container_name: pgadmin4
    restart: unless-stopped
    ports:
      - "5050:80"
    networks:
      - microservices-network
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@microservices.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_SERVER_JSON_FILE: '/pgadmin4/servers.json'
      PGADMIN_CONFIG_IMPORT_SERVERS: 'True'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./database/pgadmin-config/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres-db:
        condition: service_healthy   
      
  # Eureka server
  eureka-server:
    build: 
      context: ./infraestructuredomain/eurekaServer
      args:
        JAR_FILE: target/eurekaServer-0.0.1-SNAPSHOT.jar
    image: eureka-server:latest
    container_name: eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      
  # Apigateway service
  apigateway-service:
    build: 
      context: ./infraestructuredomain/api_gateway
      args:
        JAR_FILE: target/apigateway-0.0.1-SNAPSHOT.jar    
    image: apigateway-service:latest
    container_name: apigateway-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - microservices-network
      - keycloak-network
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      KEYCLOAK_URL: http://keycloak-server:8080
    depends_on:
      eureka-server:
        condition: service_healthy
        
  # Customer service
  customer-service:
    build: 
      context: ./businessdomain/customer
      args:
        JAR_FILE: target/customer-0.0.1-SNAPSHOT.jar
    image: customer-service:latest
    container_name: customer-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    networks:
      - microservices-network
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/customers_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123  
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres-db:
        condition: service_healthy 
        
  # Product service
  product-service:
    build: 
      context: ./businessdomain/product
      args:
        JAR_FILE: target/product-0.0.1-SNAPSHOT.jar
    image: product-service:latest
    container_name: product-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    networks:
      - microservices-network
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/products_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres-db:
        condition: service_healthy

  # Transaction service
  transaction-service:
    build: 
      context: ./businessdomain/transaction
      args:
        JAR_FILE: target/transaction-0.0.1-SNAPSHOT.jar
    image: transaction-service:latest
    container_name: transaction-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    networks:
      - microservices-network
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/transactions_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
        
        
  ###############
  ## Keycloak ##
  ###############
  
  # Keycloak database
  keycloak-db:
    image: postgres:15-alpine
    container_name: keycloak-postgres
    restart: always
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - keycloak-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 30s
      timeout: 10s
      retries: 3
      
  # Keycloak server
  keycloak-server:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak-server
    restart: always
    command: start-dev
    environment:
      # Admin credentials
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      
      # Database configuration
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      
      # Dev configuration
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
    ports:
      - "8091:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - keycloak-network
    volumes:
      - keycloak_data:/opt/keycloak/data
    